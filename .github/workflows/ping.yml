name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:        # Adds a button to trigger it manually

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run keep-alive script
        # ⚠️ REPLACE THE URL BELOW WITH YOUR ACTUAL APP URL
        run: python keep_alive.py "https://portfolio-track.streamlit.app/"
